name: Update upstream Termix

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional upstream release tag. Leave blank for latest release."
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run update script
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.tag }}
        run: |
          before=$(jq -r '.nodes."termix-src".locked.rev' flake.lock)

          tag="$UPSTREAM_TAG"
          if [[ -z "$tag" ]]; then
            tag=$(gh release view --repo Termix-SSH/Termix --json tagName -q '.tagName')
          fi

          ./update.sh "$tag"

          after=$(jq -r '.nodes."termix-src".locked.rev' flake.lock)
          tag_safe="${tag//\//-}"
          version=$(grep 'version = "' pkgs/termix.nix | head -1 | sed 's/.*version = "\(.*\)";/\1/')

          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "after=${after}" >> "$GITHUB_OUTPUT"
          echo "after_short=${after:0:12}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag_safe=${tag_safe}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date at ${after}."
          fi

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update termix to ${{ steps.update.outputs.tag }}"
          title: "chore: update Termix upstream to ${{ steps.update.outputs.tag }}"
          body: |
            Automated Termix upstream update.

            - Release tag: `${{ steps.update.outputs.tag }}`
            - Previous revision: `${{ steps.update.outputs.before }}`
            - New revision: `${{ steps.update.outputs.after }}`
            - Package version: `${{ steps.update.outputs.version }}`

            Generated by the **Update upstream Termix** workflow.
          branch: "update/termix-${{ steps.update.outputs.tag_safe }}"
          delete-branch: true
